{% extends "base.html" %}
{% block title %}Login - CopyMinas{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-container reveal">
        <h1 class="auth-title">Acesso à Conta</h1>
        <p class="auth-subtitle">Digite suas credenciais para acessar o painel</p>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            
            <div class="form-group">
                <label for="user">Usuário ou E-mail</label>
                <input type="text" id="user" name="user" required placeholder="Digite seu usuário ou e-mail">
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required placeholder="Digite sua senha">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;">
                Entrar
            </button>
        </form>

        <div class="auth-footer">
            <p style="margin-top: 1rem; color: var(--slate);"><a href="{{ url_for('main') }}">← Voltar para início</a></p>
        </div>
    </div>
</div>
{% endblock %}
