<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Copy Minas</title>
  <desc id="desc">Representação temporária da marca Copy Minas</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".18" stop-color="#8f969c"/>
      <stop offset=".42" stop-color="#f9fafb"/>
      <stop offset=".66" stop-color="#6f767c"/>
      <stop offset="1" stop-color="#dfe3e6"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3439"/>
      <stop offset="1" stop-color="#9d0007"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="13" flood-color="#000000" flood-opacity=".82"/>
    </filter>
  </defs>

  <g filter="url(#shadow)" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
    <text x="600" y="210" font-size="230" letter-spacing="-15" fill="url(#metal)" stroke="#262a2d" stroke-width="5">COPY</text>
    <text x="600" y="405" font-size="225" letter-spacing="-16" fill="url(#metal)" stroke="#262a2d" stroke-width="5">MINAS</text>
    <path d="M785 376 L850 255 L917 376 H877 L850 326 L823 376 Z" fill="url(#red)" stroke="#ff4d52" stroke-width="3"/>
    <text x="600" y="490" font-size="47" letter-spacing="10" fill="#cfd3d6">SOLUÇÕES EM TECNOLOGIA</text>
  </g>
</svg>
