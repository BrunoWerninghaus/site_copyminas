<header class="admin-header">
    <a class="admin-header__brand" href="{{ url_for('admin.dashboard') }}" aria-label="Painel administrativo Copy Minas">
        <img src="{{ url_for('static', filename='images/brand/copy-minas-logo.webp') }}" alt="Copy Minas">
        <span>ADMIN</span>
    </a>

    <nav class="admin-nav" aria-label="Navegação administrativa">
        <a href="{{ url_for('admin.dashboard') }}" {% if admin_page == "dashboard" %}aria-current="page"{% endif %}>Painel</a>
        <a href="{{ url_for('admin.products') }}" {% if admin_page == "products" %}aria-current="page"{% endif %}>Produtos</a>
        <a href="{{ url_for('admin.categories') }}" {% if admin_page == "categories" %}aria-current="page"{% endif %}>Categorias</a>
        <a href="{{ url_for('public.home') }}" target="_blank" rel="noopener noreferrer">Site ↗</a>
    </nav>

    <form method="post" action="{{ url_for('admin.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="admin-header__logout" type="submit">Sair</button>
    </form>
</header>
